# Builds WarcraftXL.dll and wxl-patcher.exe (Win32) against wxl-sdk checked out beside them, runs ctest,
# and publishes both as a release on every push to main. Version: SERIES.<commit count>.
name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERIES: '1.3'
  SDK_REPO: WarcraftXL/wxl-sdk
  SDK_REF: main

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit count

      - name: Checkout wxl-sdk
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          path: wxl-sdk

      - name: Work out the version
        id: v
        run: |
          $count   = [int](git rev-list --count HEAD)
          $release = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
          $version = if ($release) { "$env:SERIES.$count" } else { 'dev-' + $env:GITHUB_SHA.Substring(0, 7) }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host $version

      - name: Configure (Win32)
        run: cmake -S . -B build -A Win32 "-DWXL_SDK_DIR=$env:GITHUB_WORKSPACE/wxl-sdk"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage dist/
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\Release\WarcraftXL.dll" -Destination "dist\WarcraftXL.dll"
          Copy-Item "build\Release\wxl-patcher.exe" -Destination "dist\wxl-patcher.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: wxl-core-${{ steps.v.outputs.version }}
          path: |
            dist/WarcraftXL.dll
            dist/wxl-patcher.exe
          if-no-files-found: error

  # The tag is made here; one made with GITHUB_TOKEN starts no other run.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wxl-core-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: WarcraftXL v${{ needs.build.outputs.version }}
          body: Built from ${{ github.sha }}
          files: |
            WarcraftXL.dll
            wxl-patcher.exe
          generate_release_notes: true
          prerelease: false
