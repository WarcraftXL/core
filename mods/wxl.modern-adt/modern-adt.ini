; wxl.modern-adt: later expansions' ADT data read by the 3.3.5a client. One section per feature.

[texture_scale]
; Retail's per-texture scale (MTXP, or MTXF's bits 4 to 7): a texture drawn 2^scale times larger
; than the client's eight repeats a chunk. Maps without it (every stock map) are drawn as before.
enabled = 1
; auto: MTXP when an ADT has it, else MTXF; mtxp or mtxf: that chunk only.
source = auto

[height_blend]
; Retail's height blend: where layers meet, the one whose _h texture stands higher shows through,
; weighted by MTXP's heightScale and heightOffset. In the single-pass ps_3_0 terrain programs on
; Direct3D 9 and Vulkan; textures without MTXP heights or an _h file blend as before.
enabled = 1
; Only on maps whose WDT flags height texturing (MPHD 0x80), as retail decides it. 0 lets data made
; for 3.3.5a without the flag blend too.
require_wdt_flag = 1

[extra_layers]
; Up to 8 texture layers a chunk, where the client holds 4: from the tile's split texture file
; (<tile>_tex0.adt, retail's layout) when it has one, else from the root ADT's own MCNK naming more
; than 4 (Noggit-style tools, WorldGen). Drawn on the
; single-pass vertex-program path in a second, blended pass. Needs height_blend's programs.
enabled = 1
